services:
  mysql:
    image: mysql:8.0
    container_name: coffee-shop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coffeeshop
      MYSQL_USER: coffeeshop
      MYSQL_PASSWORD: coffeeshop
      TZ: Asia/Seoul
    # [2026-05-11 수정] host 포트를 3306 → 3308 로 이동.
    # 사유: 사용자 환경의 3306/3307 이 다른 MySQL 로 점유 중이라 충돌.
    ports:
      - "3308:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    container_name: coffee-shop-redis
    # [2026-05-11 수정] host 포트를 6379 → 6380 로 이동.
    # 사유: 6379 가 다른 Redis 로 점유 중. 키 충돌 / 분산락 경쟁 방지 위해 분리.
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # [2026-05-11 추가] 외부 데이터 플랫폼 발행 운영 구현체 (KafkaDataPlatformPublisher) 검증용.
  # KRaft 단일 노드 모드 — zookeeper 의존 없음. 채점자/리뷰어가 docker compose up 만으로
  # 카프카 발행까지 검증 가능하도록 포함. mock 모드에서는 떠 있지 않아도 무방.
  # 공식 apache/kafka 이미지 사용 (bitnami 일부 태그 미공개 이슈 회피).
  kafka:
    image: apache/kafka:3.7.1
    container_name: coffee-shop-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft (Zookeeper 없는 컨트롤러+브로커 합체 모드) 단일 노드 설정.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # CONTROLLER quorum 은 컨테이너 내부 hostname(localhost) 으로 자기 자신을 지정.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # listeners: 외부(PLAINTEXT) + 컨트롤러 채널(CONTROLLER) 분리.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # advertised: 호스트(Spring Boot) 에서 접근 시 localhost:9092 로 응답하도록 광고.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # 토픽 자동 생성 허용 — 채점자가 사전 setup 없이 첫 publish 로 토픽이 만들어지도록.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 단일 노드라 replication factor 모두 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  mysql_data:
  redis_data:
  kafka_data:
