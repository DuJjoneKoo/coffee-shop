spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:mysql://localhost:3306/coffeeshop?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: coffeeshop
    password: coffeeshop
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: create-drop  # 로컬 한정. 운영에선 절대 사용 금지.
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
